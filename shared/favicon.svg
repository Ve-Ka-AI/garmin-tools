<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <linearGradient id="primaryGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>
  
  <rect x="5" y="5" width="90" height="90" rx="25" fill="url(#primaryGradient)" />
  <rect x="5" y="5" width="90" height="90" rx="25" fill="url(#glassGradient)" stroke="rgba(255,255,255,0.4)" stroke-width="2" style="backdrop-filter: blur(10px);" />
  
  <text x="50" y="66" font-family="'Inter', 'Outfit', sans-serif" font-weight="800" font-size="46" fill="#ffffff" text-anchor="middle" letter-spacing="-2">GT</text>
</svg>
